name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main, master]
  # GitHub cron is UTC; Senegal is UTC+0.
  schedule:
    - cron: "0 8 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect site root
        id: site
        shell: bash
        run: |
          set -e
          if [ -f "index.html" ]; then
            echo "path=." >> "$GITHUB_OUTPUT"
          elif [ -f "ramas-parfumerie-site/index.html" ]; then
            echo "path=./ramas-parfumerie-site" >> "$GITHUB_OUTPUT"
          else
            echo "path=." >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare public storefront
        shell: bash
        run: |
          set -e
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.vercel/' \
            --exclude='_site/' \
            --exclude='node_modules/' \
            --exclude='admin.html' \
            --exclude='assets/admin.js' \
            --exclude='assets/admin.css' \
            --exclude='assets/admin-fix.css' \
            --exclude='api/' \
            --exclude='server.js' \
            --exclude='product-store.js' \
            --exclude='render.yaml' \
            --exclude='vercel.json' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='.env*' \
            --exclude='products.json' \
            "${{ steps.site.outputs.path }}/" _site/

      - name: Verify the shared persistent catalog
        shell: bash
        env:
          PRODUCT_API_URL: https://ramas-parfumerie-app.onrender.com/api/products
        run: |
          set -euo pipefail
          catalog="$(curl --fail --silent --show-error \
            --retry 5 --retry-delay 15 --retry-all-errors \
            --connect-timeout 10 --max-time 90 \
            "$PRODUCT_API_URL")"
          printf '%s' "$catalog" | jq --exit-status \
            '.managed == true and .persistent == true and (.products | type == "array")' \
            >/dev/null
          product_count="$(printf '%s' "$catalog" | jq '.products | length')"
          echo "Verified $product_count products from the managed persistent catalog."

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
