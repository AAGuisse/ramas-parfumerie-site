services:
  - type: web
    name: ramas-parfumerie-app
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USER
        value: ramas-admin
      - key: ADMIN_PASSWORD
        generateValue: true
