databases:
  - name: ramas-parfumerie-products
    databaseName: ramas_parfumerie
    user: ramas_parfumerie
    plan: basic-256mb

services:
  - type: web
    name: ramas-parfumerie-app
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ramas-parfumerie-products
          property: connectionString
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
